name: 'northpeak'
version: '1.0.0'
config-version: 2

# This profile lives in profiles.yml (same dir, thanks to --profiles-dir .)
profile: 'northpeak'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Layered materialization strategy:
#   staging      -> views  (cheap, always fresh, just a typed window on raw)
#   intermediate -> ephemeral/views (reusable logic, no need to persist)
#   marts        -> tables (query performance for BI / self-serve users)
models:
  northpeak:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
